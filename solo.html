<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git-veil solo guide</title>
<script>
window.MathJax = {
  tex: { displayMath: [['$$','$$']], inlineMath: [] },
  startup: { typeset: false },
  svg: { fontCache: 'global' }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { max-width: 64rem; margin: 2rem auto; padding: 0 1.25rem; font-family: system-ui, sans-serif; line-height: 1.5; color: #1b1f24; }
  nav { border-bottom: 1px solid #d0d7de; padding-bottom: .6rem; margin-bottom: 1.4rem; }
  nav a { margin-right: 1.1rem; }
  h1, h2, h3 { line-height: 1.2; border-bottom: 1px solid #d0d7de; padding-bottom: .25em; }
  table { border-collapse: collapse; margin: 1rem 0; }
  td, th { border: 1px solid #d0d7de; padding: .35rem .6rem; }
  pre { background: #f6f8fa; padding: .75rem; overflow-x: auto; border-radius: 6px; }
  code { background: #f0f2f4; padding: .1rem .3rem; border-radius: 4px; }
  pre code { background: none; padding: 0; }
  mjx-container { overflow-x: auto; }
</style>
</head>
<body>
<nav>
  <a href="index.html">Getting started</a>
  <a href="solo.html">Solo</a>
  <a href="team.html">Team</a>
  <a href="design.html">Design specification</a>
</nav>
<div id="content"><p>Loading docs/solo.md from the default branch…</p></div>
<script>
(function () {
  var src = 'https://raw.githubusercontent.com/prompt-cult/git-veil/HEAD/docs/solo.md';
  fetch(src, { headers: { 'Accept': 'text/plain' } })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (md) {
      var parts = md.split('$$');
      var html = '';
      for (var i = 0; i < parts.length; i++) {
        if (i % 2 === 0) {
          html += marked.parse(parts[i]);
        } else {
          var math = parts[i]
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          html += '<div class="math-block">$$' + math + '$$</div>';
        }
      }
      document.getElementById('content').innerHTML = html;
      return window.MathJax.startup.promise;
    })
    .then(function () { return window.MathJax.typesetPromise(); })
    .catch(function (e) {
      document.getElementById('content').innerHTML =
        '<p>Failed to load or render docs/solo.md: ' + e + '</p>';
    });
})();
</script>
</body>
</html>
