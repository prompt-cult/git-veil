[package]
name = "git-veil"
version = "0.5.2"
edition = "2021"
authors = ["git-veil contributors"]
description = "Store encrypted secrets in a git repository using age encryption"
license = "GPL-3.0-or-later"
homepage = "https://github.com/prompt-cult/git-veil"
repository = "https://github.com/prompt-cult/git-veil"
documentation = "https://docs.rs/git-veil"
readme = "README.md"
keywords = ["git", "age", "encryption", "secrets", "git-veil"]
categories = ["command-line-utilities", "cryptography"]
# Never ship the scratch-directory marker to crates.io.
exclude = [".tmp/*", ".idea/*"]

[dependencies]
# age encryption (age-encryption.org/v1 spec)
age = { version = "0.12", features = ["armor"] }

# Ed25519 signing (RFC 8032)
ed25519-dalek = { version = "2", features = ["rand_core"] }

# CLI ("string" feature lets the manpages generator pass runtime-computed
# subcommand names to Command::name)
clap = { version = "4.5", features = ["derive", "string"] }

# Shell completion generation for the `completions` subcommand (runtime)
clap_complete = "4"

# Roff man page generation for the `manpages` subcommand (runtime)
clap_mangen = "0.2"

# Error handling
anyhow = "1.0"

# Serialization for config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Random number generation
rand = "0.8"

# Base64 encoding (for signatures)
base64 = "0.21"

# Hex encoding (for Ed25519 keys)
hex = "0.4"

# URL parsing
regex = "1.10"

# SHA-256 digest of accepted keyrings (fork detection, issue #20)
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.0"
serial_test = "3.1"
# tests/docs_drift.rs drives the real clap definition directly.
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = "4"

# cargo-binstall support (issue #10): release assets are raw binaries named
# git-veil-<os>-<arch> with sidecar .sha256 files; no archive, no version in
# the filename.
[package.metadata.binstall]
pkg-url = "https://github.com/prompt-cult/git-veil/releases/download/v{ version }/{ name }-{ format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides]
x86_64-unknown-linux-gnu.format = "linux-x86_64"
x86_64-apple-darwin.format = "macos-x86_64"
aarch64-apple-darwin.format = "macos-aarch64"
