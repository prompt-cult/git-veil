[package]
name = "git-veil-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[dependencies.git-veil]
path = ".."

[[bin]]
name = "keyring_parse"
path = "fuzz_targets/keyring_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_git_remote_url"
path = "fuzz_targets/parse_git_remote_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trust_store_load"
path = "fuzz_targets/trust_store_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sanitize_repo_id"
path = "fuzz_targets/sanitize_repo_id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tracked_files_load"
path = "fuzz_targets/tracked_files_load.rs"
test = false
doc = false
bench = false
