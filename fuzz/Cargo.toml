[package]
name = "git-gpg-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pgp = "0.19"
rand = "0.8"
serde_json = "1.0"

[dependencies.git-gpg]
path = ".."

[[bin]]
name = "keyring_parse"
path = "fuzz_targets/keyring_parse.rs"
test = false
doc = false
bench = false

