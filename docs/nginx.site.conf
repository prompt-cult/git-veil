# ------------------------------------------------------------------------------
# LOCAL SITE TESTING ONLY — NOT A SHIPPING ARTIFACT
#
# Minimal nginx server block for the docs/Dockerfile.site local testing image.
# It copies the published-site behaviour that matters locally:
#   - serves the built mdBook from /usr/share/nginx/html;
#   - index.html as the directory index, relative links throughout the book;
#   - a 404 for anything that is not a file (static site, no rewrites).
# Listen on 8080: an unprivileged port inside the container, mapped with
# `docker run -p 8080:8080`.
# ------------------------------------------------------------------------------

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Static book output: serve files as-is, 404 on anything else.
    location / {
        try_files $uri $uri/ =404;
    }

    # Long-cache fingerprinted static assets; keep pages revalidated.
    location ~* \.(?:css|js|png|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
}
