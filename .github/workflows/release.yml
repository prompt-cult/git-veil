name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  resolve-tag:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Verify release tag and main ancestry
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$RELEASE_TAG" = "v$version"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-msi:
    needs: resolve-tag
    uses: ./.github/workflows/windows-msi.yml
    with:
      tag: ${{ needs.resolve-tag.outputs.commit }}

  # Fuzz smoke is part of the release itself, so the agent monitoring the
  # release build sees a fuzz crash as a release failure. It does not run
  # on PRs or main pushes (see fuzz-smoke.yml).
  fuzz-smoke:
    needs: resolve-tag
    uses: ./.github/workflows/fuzz-smoke.yml
    with:
      tag: ${{ needs.resolve-tag.outputs.commit }}

  build-release:
    needs: resolve-tag
    name: Build Release - ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # blacksmith-6vcpu-macos-15 is an arm64 (Apple Silicon) runner, so
          # macos-aarch64 is a native build and macos-x86_64 is a
          # cross-compile via the installed target.
          - os: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            asset_name: git-veil-linux-x86_64
          - os: blacksmith-6vcpu-macos-15
            target: x86_64-apple-darwin
            asset_name: git-veil-macos-x86_64
          - os: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
            asset_name: git-veil-macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-release-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/git-veil

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/git-veil ${{ matrix.asset_name }}

      - name: Generate checksum
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  man-pages:
    needs: resolve-tag
    name: Man Pages
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.commit }}

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-manpages-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-manpages-

      - name: Generate man pages
        run: ./scripts/gen-docs.sh

      - name: Package man pages
        run: |
          tar -czf git-veil-man-pages.tar.gz -C docs man
          sha256sum git-veil-man-pages.tar.gz > git-veil-man-pages.tar.gz.sha256

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-man-pages
          path: |
            git-veil-man-pages.tar.gz
            git-veil-man-pages.tar.gz.sha256

  create-release:
    name: Create Release
    needs: [resolve-tag, build-release, man-pages, windows-msi, fuzz-smoke]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Download staged release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify tag still points to the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: release-source
          fetch-depth: 0
      - name: Check tag commit
        env:
          EXPECTED_COMMIT: ${{ needs.resolve-tag.outputs.commit }}
        shell: bash
        run: test "$(git -C release-source rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Generate release notes from shipped changes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 release-source/scripts/generate-release-notes.py "$GITHUB_REPOSITORY" "$RELEASE_TAG" > "$RUNNER_TEMP/generated-notes.md"
          notes="release-source/release-notes/$RELEASE_TAG.md"
          if test -f "$notes"; then
            cat "$notes" "$RUNNER_TEMP/generated-notes.md" > "$RUNNER_TEMP/release-notes.md"
          else
            cp "$RUNNER_TEMP/generated-notes.md" "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Verify staged assets and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for asset in git-veil-linux-x86_64 git-veil-macos-x86_64 git-veil-macos-aarch64 git-veil-man-pages.tar.gz git-veil-windows-x86_64.exe git-veil-windows-x86_64.msi git-veil-windows-x86_64-portable.zip; do
            test -f "$asset"
            test -f "$asset.sha256"
            sha256sum -c "$asset.sha256"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 14
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --notes-file "$RUNNER_TEMP/release-notes.md" ./*
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
