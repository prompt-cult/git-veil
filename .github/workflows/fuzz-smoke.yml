# Fuzz Smoke: blanket-fuzzes every attacker-controlled parse surface on
# release. The targets, what each one attacks, and the oracles it asserts
# live in fuzz/fuzz_targets/*.rs - one file per target, which is where to
# look for more. Committed seed corpora live in fuzz/corpus/<target>/.
#
# This workflow is CALLED BY the release workflow (release.yml) only. It
# never runs on PRs or main pushes: the release job is what agents watch,
# so a fuzz crash fails the release the agent is monitoring. docs-only
# releases skip the fuzz targets; pass docs_changed=false from the caller.

name: Fuzz Smoke

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to test
        required: false
        type: string
        default: ''
      docs_changed:
        description: Whether the release push changed docs only
        required: false
        type: boolean
        default: false
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-smoke:
    name: Fuzz Smoke - ${{ matrix.target }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # A hung fuzz run must not bill GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - keyring_parse
          - parse_git_remote_url
          - trust_store_load
          - sanitize_repo_id
          - tracked_files_load
          - pin_file_parse
          - codeowners_parse
          - verifying_key_parse
          - x25519_key_parse

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install nightly toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # cargo-fuzz has no config-file support, so libFuzzer flags are
      # passed per invocation.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-fuzz-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-registry-

      - name: Cache fuzz build
        uses: actions/cache@v4
        with:
          path: fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-build-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }} (smoke)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -runs=2000 -timeout=25 -max_len=65536

      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 7
