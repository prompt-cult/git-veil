name: pages

# Documentation site only: the mdBook is built from `book.toml` + `docs/src/`
# and deployed to GitHub Pages. No binary is built in this job — that is the
# release workflow's job.
#
# The official Pages deployment path is used (upload-pages-artifact /
# deploy-pages), so the site is served from an artifact rather than a
# `gh-pages` branch, and Jekyll never touches the output. mdBook is left
# without a `site-url`, which is what keeps every generated link relative and
# makes the site work from the `https://prompt-cult.github.io/git-veil/`
# subpath.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual rebuilds: Actions tab - pages - Run workflow, or
  # `gh workflow run pages`. The deploy is gated on push, so a manual run
  # must also be able to deploy; see the dispatch condition below.
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; the last push to main is the one that ships.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # mdBook is not a project dependency, so it is not in Cargo.lock and is
      # not installed by the crate build. The two binaries are version-pinned
      # and cached: a runner reusing the cache skips both compiles entirely,
      # which are the slowest steps of this job otherwise. Bump both the
      # versions and the cache key together.
      - name: Cache mdBook and mdbook-mermaid
        uses: actions/cache@v4
        id: mdbook-cache
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
          key: mdbook-${{ runner.os }}-mdbook-0.5.4-mermaid-0.17.1
      - name: Install mdBook
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        run: cargo install mdbook --version 0.5.4 --locked
      - name: Install mdbook-mermaid
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        run: cargo install mdbook-mermaid --version 0.17.1 --locked
      # `create-missing = false` in book.toml makes a SUMMARY entry naming a
      # file that does not exist a build failure rather than a generated stub.
      - name: Build the book
        run: mdbook build
      # plain.txt: the whole book as one plain-text file at the site root.
      # mdBook's print page (print.html) carries every chapter in one page;
      # this renders that output as text, in the build, so the published
      # plain.txt can never drift from the HTML it comes from. The script is
      # a uv script (PEP 723, standard library only, python >= 3.9), so the
      # runner needs uv; the same script runs in docs/Dockerfile.site.
      - name: Install uv
        run: pip install uv
      - name: Generate plain.txt
        run: ./scripts/gen-plain-txt.py
      # Crawler layer, all generated here so it can never drift: sitemap.xml
      # (chapters in SUMMARY.md order, print.html last), llms.txt (llmstxt.org
      # v2, pointing at the two whole-book single-fetch assets), and
      # canonical/meta-description/Open Graph tags injected into every built
      # page. The description is the book-level one from book.toml. See the
      # script header for what is deliberately skipped (og:image).
      - name: Generate crawler metadata
        run: ./scripts/gen-crawler-meta.py
      # mdBook resolves links between its own pages at build time but does not
      # verify that a link target exists. This does: every relative href in the
      # built HTML must resolve to a file in the build directory, and every
      # fragment must name a heading that page actually carries.
      - name: Check internal links
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("_book")
          href = re.compile(r'href="([^"]+)"')
          anchors = {
              page: set(re.findall(r'id="([^"]+)"', page.read_text(encoding="utf-8")))
              for page in root.rglob("*.html")
          }
          broken = []
          for page in sorted(root.rglob("*.html")):
              for link in href.findall(page.read_text(encoding="utf-8")):
                  if link.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  path, sep, fragment = link.partition("#")
                  target = (root / path.lstrip("/")) if path.startswith("/") else (page.parent / path)
                  target = target.resolve()
                  if not target.exists():
                      broken.append(f"{page.relative_to(root)} -> {link}")
                  elif sep and fragment and target in anchors and fragment not in anchors[target]:
                      broken.append(f"{page.relative_to(root)} -> {link} (no such heading)")
          for line in broken:
              print(f"broken link: {line}")
          sys.exit(1 if broken else 0)
          PY
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _book

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Least privilege: the build job only ever reads the repository, and only
    # the deployment needs the Pages token and the OIDC exchange.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
