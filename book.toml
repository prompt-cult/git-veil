[book]
title = "git-veil"
description = "Secret management for git repositories: files are encrypted in place with age-family X25519 encryption, the keyring that names who can decrypt is Ed25519-signed, and trust is pinned per machine by a possession proof."
authors = ["Simon Massey"]
language = "en"
src = "docs/src"

[build]
build-dir = "_book"
create-missing = false

# The design specification's $$ math blocks are stashed as raw HTML comments
# before markdown rendering (pulldown-cmark's escape rules mangle TeX array
# row separators) and decoded back into the page by docs/tex-mj3.js before
# MathJax typesets.
[preprocessor.mathblock]
command = "scripts/mdbook-mathblock.py"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
# The site is served from https://prompt-cult.github.io/git-veil/, a subpath
# of the Pages host. mdBook emits root-relative asset URLs only when
# `site-url` is set; leaving it unset keeps every generated link relative,
# which is what a subpath deployment needs.
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/prompt-cult/git-veil"
edit-url-template = "https://github.com/prompt-cult/git-veil/edit/main/docs/src/{path}"
# docs/design.md carries the algorithm listings as display-math blocks
# ($$ ... $$) using \multicolumn, \textsc and array environments. The
# built-in mathjax-support flag uses MathJax 2, which cannot render those
# macros, so the book loads MathJax 3's tex-svg output instead: see
# docs/tex-mj3.js, wired in below.
additional-js = ["docs/tex-mj3.js", "mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true
